[package]
name         = "lapce"
version      = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
default-run  = "lapce-floem"

[dependencies]
lapce-app   = { path = "./lapce-app" }
lapce-iced  = { path = "./lapce-iced" }
lapce-proxy = { path = "./lapce-proxy" }

[[bin]]
name = "lapce-floem"
path = "src/bin/lapce-floem.rs"

[[bin]]
name = "lapce-iced"
path = "src/bin/lapce-iced.rs"

[[bin]]
name = "lapce-proxy"
path = "src/bin/lapce-proxy.rs"

[workspace]
exclude = ["patches/iced_graphics"]
members = ["lapce-app", "lapce-proxy", "lapce-rpc", "lapce-core", "lapce-client", "lapce-engine", "lapce-services", "lapce-iced"]

[workspace.package]
version      = "0.4.6"
edition      = "2024"
rust-version = "1.98.0"
license      = "Apache-2.0"
homepage     = "https://lapce.dev"
authors      = ["Dongdong Zhou <dzhou121@gmail.com>"]

[workspace.dependencies]
anyhow            = { version = "1.0" }
backtrace         = { version = "0.3" }
chrono            = { version = "0.4" }
clap              = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "derive"] }
crossbeam-channel = { version = "0.5.17" }
directories       = { version = "4.0.1" }
flate2            = { version = "1.1" }
git2              = { version = "0.21.0", features = ["vendored-openssl", "vendored-libgit2"] }
globset           = { version = "0.4.21" }
hashbrown         = { version = "0.14.5", features = ["serde"] }
im                = { version = "15.1.0", features = ["serde"] }
include_dir       = { version = "0.7" }
indexmap          = { version = "2.14", features = ["serde"] }
itertools         = { version = "0.12.1" }
notify            = { version = "5.2.0", features = ["serde"] }
once_cell         = { version = "1.21" }
parking_lot       = { version = "0.12.5" }
rayon             = { version = "1.12.0" }
regex             = { version = "1.13.1" }
remain            = { version = "0.2" }
semver            = { version = "1.0" }
reqwest           = { version = "0.11", features = ["blocking", "json", "socks"] }
serde             = { version = "1.0" }
serde_json        = { version = "1.0" }
smallvec          = { version = "1.16.4" }
strum             = { version = "0.27.2" }
strum_macros      = { version = "0.27.2" }
tar               = { version = "0.4" }
tempfile          = { version = "3.27.0" }
thiserror         = { version = "1.0" }
toml              = { version = "*" }
toml_edit         = { version = "0.20.7", features = ["serde"] }
url               = { version = "2.5.8" }
zstd              = { version = "0.11.2" }

lsp-types = { version = "0.95.1", features = ["proposed"] }                                                  # not following semver, so should be locked to patch version updates only

lapce-xi-rope = { version = "0.3.2", features = ["serde"] }

lapce-services = { path = "./lapce-services" }
lapce-engine = { path = "./lapce-engine" }
lapce-client = { path = "./lapce-client", default-features = false }
lapce-core  = { path = "./lapce-core" }
lapce-rpc   = { path = "./lapce-rpc" }
lapce-proxy = { path = "./lapce-proxy" }

[workspace.dependencies.floem]
# path = "../floem"
git = "https://github.com/lapce/floem"
rev = "31fa8f444c37f4c314f47d88c23ffdbc25f2ab53"
features = ["editor", "serde", "default-image-formats", "rfd-async-std"]

[workspace.dependencies.floem-editor-core]
# path = "../floem/editor-core/"
git = "https://github.com/lapce/floem"
rev = "31fa8f444c37f4c314f47d88c23ffdbc25f2ab53"
features = ["serde"]

[patch.crates-io]
# Keep offscreen caret layouts valid when async highlighting updates attributes.
iced_graphics = { path = "patches/iced_graphics" }
# Temporarily patch lsp-types with a version that adds message-type debug
lsp-types = { git = "https://github.com/lapce/lsp-types", rev = "feaa1e2ec80975c9dadd400a238ceacf071058e6" }

# cargo vendor issue: https://github.com/rust-lang/cargo/issues/10310
# dpi comes from winit (source) and muda (crate)
dpi = { git = "https://github.com/rust-windowing/winit", rev = "ee245c569d65fdeacf705ee5eedb564508d10ebe" }


[workspace.dependencies.tracing]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing"

[workspace.dependencies.tracing-log]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-log"

[workspace.dependencies.tracing-subscriber]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-subscriber"

[workspace.dependencies.tracing-appender]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-appender"

[workspace.dependencies.alacritty_terminal]
git = "https://github.com/alacritty/alacritty"
rev = "cacdb5bb3b72bad2c729227537979d95af75978f"

[profile.release-lto]
inherits      = "release"
lto           = true
codegen-units = 1

# A profile which compiles all (non-workspace) dependencies in release mode
# but Lapce code in dev mode. This gives a good debugging experience for your
# code and fast performance of other people's code. After the initial
# build subsequent ones are as fast as dev mode builds.
# See https://doc.rust-lang.org/cargo/reference/profiles.html
# To use this profile:
#   cargo build --profile fastdev
#   cargo run --profile fastdev --bin lapce-floem
[profile.fastdev.package."*"]
opt-level = 3

[profile.fastdev]
inherits = "dev"
