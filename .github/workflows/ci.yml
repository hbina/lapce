on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - lapce-**
      - src/**
      - .github/workflows/ci.yml
      - scripts/**
  workflow_dispatch:

name: CI

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions: {}

jobs:
  architecture:
    name: Crate boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Check architecture
        run: python3 scripts/check-architecture.py

  build:
    name: Rust on Linux
    if: github.event.pull_request.draft == false
    needs: [fmt, clippy, architecture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install dependencies on Ubuntu
        run: sudo make ubuntu-deps

      - name: Update toolchain
        run: |
          rustup update --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --profile ci --frozen

      - name: Validate live Rust language server
        shell: bash
        env:
          LAPCE_TEST_PROXY: ${{ github.workspace }}/target/ci/lapce-proxy
        run: |
          rustup component add rust-analyzer
          LAPCE_TEST_LSP="$(rustup which rust-analyzer)" cargo test --profile ci --frozen -p lapce-engine --test live_lsp -- --include-ignored

      - name: Check resolved frontend dependencies
        run: python3 scripts/check-architecture.py --resolved

      - name: Build and test iced frontend
        env:
          LAPCE_TEST_PROXY: ${{ github.workspace }}/target/ci/lapce-proxy
        run: |
          cargo build --profile ci --frozen --bin lapce-iced
          LAPCE_TEST_LSP="$(rustup which rust-analyzer)" cargo test --profile ci --frozen -p lapce-iced -- --include-ignored

      - name: Test foreground and embedded startup
        run: |
          cargo test --profile ci --frozen -p lapce-app --lib cli_tests
          cargo test --profile ci --frozen -p lapce-proxy --lib
          cargo test --profile ci --frozen -p lapce-services --test logging
          cargo test --profile ci --frozen -p lapce-client --features embedded-backend --test process embedded_

      - name: Test separate backend process
        shell: bash
        env:
          LAPCE_TEST_PROXY: ${{ github.workspace }}/target/ci/lapce-proxy
        run: |
          cargo check --profile ci --frozen -p lapce-app --no-default-features
          cargo test --profile ci --frozen -p lapce-rpc --lib
          cargo test --profile ci --frozen -p lapce-client --no-default-features --lib --test leases
          cargo test --profile ci --frozen -p lapce-client --no-default-features --test process -- --include-ignored
          cargo test --profile ci --frozen -p lapce-engine --test process_reconnect -- --include-ignored

      - name: Test shared frontend processes over Unix sockets
        run: |
          cargo build --profile ci --frozen -p lapce-client --example shared_host -p lapce-engine --example terminal
          python3 scripts/test-shared-frontends.py

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: lapce-linux
          path: |
            target/ci/lapce*
          retention-days: 1

      - name: Run doc tests
        run: cargo test --profile ci --doc --workspace

  fmt:
    name: Formatting and spellchecking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Update toolchain & add rustfmt
        run: |
          rustup update
          rustup component add rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check

      - name: Spell Check Repo
        uses: crate-ci/typos@02ea592e44b3a53c302f697cddca7641cd051c3d

  clippy:
    name: Clippy on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Update toolchain & add clippy
        run: |
          rustup update --no-self-update
          rustup component add clippy

      - name: Install dependencies on Ubuntu
        run: sudo make ubuntu-deps

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run clippy
        run: cargo clippy --profile ci
