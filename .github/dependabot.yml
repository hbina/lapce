version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    groups:
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "tracing*"
          - "strum*"
          - "tree-sitter"
          - "floem*"
      toml:
        patterns:
          - "toml"
          - "toml_edit"
      strum:
        patterns:
          - "strum"
          - "strum_macros"
      tracing:
        patterns:
          - "tracing*"
      floem:
        patterns:
          - "floem*"
      tree-sitter:
        patterns:
          - "tree-sitter"
